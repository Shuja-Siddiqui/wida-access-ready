server {
    listen 80;
    listen [::]:80;
    server_name goelprep.com www.goelprep.com;

    client_max_body_size 25m;

    location /api/ {
        # Resolve at request time so nginx can start if DNS is briefly down.
        resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
        set $api_host api.goelprep.com;
        proxy_pass https://$api_host;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host api.goelprep.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
